<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Flip 7 Multiplayer</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: #0f172a; color: #f8fafc; display: flex; flex-direction: column; min-height: 100vh; padding: 16px; }
    .container { max-width: 600px; margin: 0 auto; width: 100%; }
    .card-box { background: #1e293b; border: 1px solid #334155; border-radius: 12px; padding: 24px; box-shadow: 0 10px 15px -3px rgba(0,0,0,0.5); }
    h1 { color: #f59e0b; text-align: center; margin-bottom: 8px; font-size: 2rem; font-weight: 800; }
    p.sub { text-align: center; color: #94a3b8; margin-bottom: 24px; font-size: 0.9rem; }
    label { display: block; margin-bottom: 6px; font-size: 0.85rem; color: #cbd5e1; font-weight: 600; text-transform: uppercase; }
    input { width: 100%; padding: 12px; background: #0f172a; border: 1px solid #475569; border-radius: 8px; color: #fff; font-size: 1rem; margin-bottom: 16px; }
    input:focus { outline: none; border-color: #f59e0b; }
    button { width: 100%; padding: 14px; background: #f59e0b; border: none; border-radius: 8px; color: #0f172a; font-weight: 700; font-size: 1rem; cursor: pointer; transition: background 0.2s; }
    button:hover { background: #d97706; }
    button:disabled { background: #475569; color: #94a3b8; cursor: not-allowed; }
    .debug-terminal { margin-top: 24px; background: #020617; border: 1px solid #1e293b; border-radius: 8px; padding: 12px; font-family: monospace; font-size: 0.75rem; color: #38bdf8; max-height: 180px; overflow-y: auto; }
    .debug-line { margin-bottom: 4px; word-break: break-all; }
    .debug-err { color: #f87171; font-weight: bold; }
    .debug-success { color: #4ade80; font-weight: bold; }
    .hidden { display: none !important; }
    .game-header { display: flex; justify-content: space-between; align-items: center; background: #1e293b; padding: 12px 16px; border-radius: 8px; margin-bottom: 16px; }
    .btn-secondary { background: #334155; color: #fff; padding: 8px 16px; font-size: 0.85rem; width: auto; }
  </style>

  <!-- Firebase Compatibility Scripts -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
</head>
<body>

  <div class="container">
    <!-- LOBBY SCREEN -->
    <div id="lobby-screen" class="card-box">
      <h1>FLIP 7</h1>
      <p class="sub">Online Realtime Multiplayer</p>
      
      <form id="join-form" onsubmit="handleEnterRoom(event)">
        <label for="username">Your Nickname</label>
        <input type="text" id="username" placeholder="e.g. Alex" required maxlength="12">

        <label for="room-code">Room Code (or blank to auto-generate)</label>
        <input type="text" id="room-code" placeholder="e.g. GAME1" maxlength="10">

        <button type="submit" id="enter-btn">ENTER GAME ROOM</button>
      </form>

      <div class="debug-terminal" id="debug-log">
        <div class="debug-line">[System Ready] Waiting for user input...</div>
      </div>
    </div>

    <!-- GAME ROOM SCREEN -->
    <div id="game-screen" class="card-box hidden">
      <div class="game-header">
        <div>
          <span style="color:#94a3b8; font-size:0.8rem;">ROOM:</span>
          <strong id="disp-room" style="color:#f59e0b; font-size:1.1rem;">-</strong>
        </div>
        <button class="btn-secondary" onclick="copyInviteLink()">Copy Invite Link</button>
      </div>

      <div style="text-align: center; padding: 32px 0;">
        <h2 style="margin-bottom: 8px;">Connected to Room!</h2>
        <p style="color: #94a3b8;" id="disp-player">Waiting for players...</p>
        <div id="players-list" style="margin-top: 20px; text-align: left; background: #0f172a; padding: 16px; border-radius: 8px;"></div>
      </div>
    </div>
  </div>

  <script>
    // 1. Logger Utility
    function log(msg, type = 'info') {
      const box = document.getElementById('debug-log');
      if (!box) return;
      const line = document.createElement('div');
      line.className = 'debug-line ' + (type === 'err' ? 'debug-err' : type === 'success' ? 'debug-success' : '');
      line.textContent = `[${new Date().toLocaleTimeString()}] ${msg}`;
      box.appendChild(line);
      box.scrollTop = box.scrollHeight;
      console.log(msg);
    }

    // 2. Firebase Config
    const firebaseConfig = {
      apiKey: "AIzaSyDueZlgNd4RwI2tkgxl_v0VSFXE9OYRjLc",
      authDomain: "fakeflip7.firebaseapp.com",
      databaseURL: "https://fakeflip7-default-rtdb.firebaseio.com",
      projectId: "fakeflip7",
      storageBucket: "fakeflip7.firebasestorage.app",
      messagingSenderId: "464906617088",
      appId: "1:464906617088:web:ad8dedfb5d350a6cd273e5"
    };

    let db;
    let myPlayerId = 'p_' + Math.random().toString(36).substring(2, 9);
    let currentRoomCode = '';

    // 3. Init Firebase on Load
    window.addEventListener('DOMContentLoaded', () => {
      try {
        log("Initializing Firebase...");
        if (!firebase.apps.length) {
          firebase.initializeApp(firebaseConfig);
        }
        db = firebase.database();
        log("Firebase initialized successfully!", "success");

        // Pre-fill room code from URL hash if present (#GAME123)
        if (window.location.hash) {
          const codeFromUrl = window.location.hash.substring(1).toUpperCase();
          document.getElementById('room-code').value = codeFromUrl;
          log("Detected room code from URL: " + codeFromUrl);
        }
      } catch (err) {
        log("Firebase Init Error: " + err.message, "err");
      }
    });

    // 4. Room Creation / Join Handler
    async function handleEnterRoom(e) {
      e.preventDefault();
      
      const btn = document.getElementById('enter-btn');
      const usernameInput = document.getElementById('username').value.trim();
      let roomCodeInput = document.getElementById('room-code').value.trim().toUpperCase();

      if (!usernameInput) {
        alert("Please enter a nickname");
        return;
      }

      if (!roomCodeInput) {
        roomCodeInput = Math.random().toString(36).substring(2, 7).toUpperCase();
        document.getElementById('room-code').value = roomCodeInput;
      }

      currentRoomCode = roomCodeInput;
      btn.disabled = true;
      btn.textContent = "CONNECTING...";
      log(`Attempting to join room [${currentRoomCode}] as "${usernameInput}"...`);

      try {
        const roomRef = db.ref('flip7_rooms/' + currentRoomCode);
        
        // Timeout check if Firebase doesn't respond in 5s
        const timeout = setTimeout(() => {
          log("Connection timed out! Check your Firebase Realtime Database status.", "err");
          alert("Could not connect to Firebase! Make sure 'Realtime Database' is created in test mode on Firebase Console.");
          btn.disabled = false;
          btn.textContent = "ENTER GAME ROOM";
        }, 6000);

        // Try reading room data
        const snapshot = await roomRef.once('value');
        clearTimeout(timeout);

        log("Database responded!", "success");
        let roomData = snapshot.val();

        if (!roomData) {
          log(`Room [${currentRoomCode}] doesn't exist. Creating new room...`);
          roomData = {
            createdAt: Date.now(),
            host: myPlayerId,
            state: 'lobby',
            players: {}
          };
        }

        // Add player to room
        roomData.players = roomData.players || {};
        roomData.players[myPlayerId] = {
          name: usernameInput,
          score: 0,
          joinedAt: Date.now()
        };

        // Save to Database
        await roomRef.set(roomData);
        log("Joined room successfully!", "success");

        // Listen for real-time room changes
        roomRef.on('value', (snap) => {
          const updated = snap.val();
          if (updated) renderRoomState(updated);
        });

        // Update UI
        window.location.hash = currentRoomCode;
        document.getElementById('lobby-screen').classList.add('hidden');
        document.getElementById('game-screen').classList.remove('hidden');
        document.getElementById('disp-room').textContent = currentRoomCode;
        document.getElementById('disp-player').textContent = `Logged in as: ${usernameInput}`;

      } catch (err) {
        log("Firebase Read/Write Error: " + err.message, "err");
        alert("Firebase Error: " + err.message);
        btn.disabled = false;
        btn.textContent = "ENTER GAME ROOM";
      }
    }

    function renderRoomState(roomData) {
      const listEl = document.getElementById('players-list');
      if (!listEl || !roomData.players) return;

      const playersHtml = Object.entries(roomData.players).map(([id, p]) => `
        <div style="display:flex; justify-content:space-between; padding:8px 0; border-bottom:1px solid #334155;">
          <span>${p.name} ${id === myPlayerId ? '<strong>(You)</strong>' : ''}</span>
          <span style="color:#f59e0b;">${id === roomData.host ? 'HOST' : 'READY'}</span>
        </div>
      `).join('');

      listEl.innerHTML = `<h3 style="margin-bottom:12px; font-size:0.9rem; color:#94a3b8;">PLAYERS IN LOBBY (${Object.keys(roomData.players).length}):</h3>` + playersHtml;
    }

    function copyInviteLink() {
      const url = window.location.origin + window.location.pathname + '#' + currentRoomCode;
      navigator.clipboard.writeText(url).then(() => {
        alert("Invite link copied to clipboard!\n" + url);
      });
    }
  </script>
</body>
</html>
